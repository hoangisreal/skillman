[project]
name = "skillman"
version = "0.1.0"
description = "Cold skill library manager for AI coding agents (Claude Code, Codex, OpenCode): packs, per-project injection, safe upstream updates, Textual TUI"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-include = ["bin/skillman"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E401", "E701", "E702", "E731", "E402", "E501"]
