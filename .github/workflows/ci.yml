name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests (core compat goldens, project lifecycle, upstream updates, safety gates, CLI, TUI model)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o skillman ./cmd/skillman
      - name: Shell syntax
        run: bash -n install.sh
      - name: Installer (temp HOME, idempotent)
        run: |
          export HOME="$RUNNER_TEMP/home" BIN_DIR="$RUNNER_TEMP/home/bin" SKILL_LIBRARY="$RUNNER_TEMP/home/lib"
          mkdir -p "$HOME" && ./install.sh && ./install.sh >/dev/null
          test -x "$BIN_DIR/skillman" && test -L "$BIN_DIR/skill-add" && test -e "$SKILL_LIBRARY/packs/web-vue.yaml"
          test -L "$HOME/.claude/skills/skillman" && test -L "$HOME/.agents/skills/skillman"
          ls "$BIN_DIR" | grep -c bak && exit 1 || true
          "$BIN_DIR/skillman" audit "$SKILL_LIBRARY/skills/skillman"   # shipped agent skill is valid and clean

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      # Check out the Go sources byte for byte so gofmt sees LF line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test Windows workflows
        run: go test -count=1 ./...
