name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: python -m pip install pyyaml textual==8.2.8
      - name: Lint
        run: uvx ruff@0.8.4 check .
      - name: Shell syntax
        run: bash -n bin/skill-add bin/skill-search install.sh
      - name: Core tests (packs, projects, upstream updates, safety gates)
        run: python tests/test_skillcore.py
      - name: TUI tests (Textual pilot)
        run: python tests/test_tui.py
      - name: Installer (temp HOME, idempotent)
        run: |
          export HOME="$RUNNER_TEMP/home" BIN_DIR="$RUNNER_TEMP/home/bin" SKILL_LIBRARY="$RUNNER_TEMP/home/lib"
          mkdir -p "$HOME" && ./install.sh && ./install.sh >/dev/null
          test -L "$BIN_DIR/skillman" && test -d "$SKILL_LIBRARY/skills" && test -e "$SKILL_LIBRARY/packs/web-vue.yaml"
          python3 scripts/skillcore.py audit "$SKILL_LIBRARY/skills/skillman"   # shipped agent skill is valid and clean
