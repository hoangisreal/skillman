name: Portable packages
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: python3 contrib/package.py "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
  native:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Test portable lifecycle and locking
        run: go test ./internal/core -run TestPortable -count=1
      - name: Test imports and project workflows
        run: go test ./internal/cli -run 'TestImportWorkflow|TestUpdateDryRun|TestEmptyProjectStackWorkflow|TestProjectInstallPreviewAndManifest|TestProjectAgentStatus|TestProjectVerifyClaudeLinkTarget' -count=1
      - name: Exercise native archive
        shell: bash
        run: |
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            unzip -q *-windows-amd64.zip
            ./skillman.exe --version
          else
            tar -xzf *-"$(go env GOOS)"-"$(go env GOARCH)".tar.gz
            ./skillman --version
          fi
          SKILL_LIBRARY="$PWD/library" ./skillman init
  checkout-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python contrib/test-portable-checkout.py create
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-windows
          path: ${{ runner.temp }}/portable.bundle
  checkout-linux:
    runs-on: ubuntu-latest
    needs: checkout-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: checkout-windows
          path: ${{ runner.temp }}
      - run: python contrib/test-portable-checkout.py update
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-linux
          path: ${{ runner.temp }}/portable.bundle
  checkout-mac:
    runs-on: macos-latest
    needs: checkout-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: checkout-linux
          path: ${{ runner.temp }}
      - run: python contrib/test-portable-checkout.py update-mac
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-mac
          path: ${{ runner.temp }}/portable.bundle
  checkout-verify:
    runs-on: windows-latest
    needs: checkout-mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: checkout-mac
          path: ${{ runner.temp }}
      - run: python contrib/test-portable-checkout.py verify
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, checkout-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
